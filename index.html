<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>gantt</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      #ganttHeader {
        position: absolute;
        left: 0;
        top: 20px;
        width: 10%;
        min-width: 180px;
        max-width: 320px;
        height: 40px;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F3F4F6;
        border-bottom: 1px solid #CBD5E1;
        box-sizing: border-box;
        pointer-events: none;
      }
      #resourceFilterRoot {
        position: relative;
        left: auto;
        top: auto;
        width: 100%;
        height: 40px;
        z-index: 21;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        box-sizing: border-box;
        pointer-events: auto;
      }
      .container {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="ganttHeader">
        <div id="resourceFilterRoot"></div>
      </div>
      <div id="main" style="width: 100%; height: 100%;background-color: #f0f2f5;"></div>
    </div>
    <script src="index.js" type="module"></script>
  </body>
</html>
